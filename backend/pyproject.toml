[project]
name = "fuelgrid"
version = "0.1.0"
description = "FuelGrid - Fuel Supply Intelligence & Resilience Platform"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "httpx-sse>=0.4",
  "tenacity>=9.0",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "numpy>=2.0",
  "ortools>=9.10",
  "structlog>=24.4",
  "prometheus-client>=0.20",
  "prometheus-fastapi-instrumentator>=7.0",
  "psutil>=6.0",
  "sse-starlette>=2.1",
  "scikit-learn>=1.9.1",
  "joblib>=1.6.0",
  "threadpoolctl>=3.5.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
    "locust>=2.31",
    "matplotlib>=3.11.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 140
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]  # B008: FastAPI Depends idiom; long lines are tolerated in data-heavy code
