name: CI

on:
  push: { branches: [main] }
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv sync --python 3.12
      - name: Lint
        run: uv run ruff check app tests
      - name: Tests
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - name: Type-check and build
        run: npm run build

  package:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --build-arg GIT_SHA=${{ github.sha }} -t fuelgrid:${{ github.sha }} .
      - name: Smoke test (health check)
        run: |
          docker run -d --name fg -p 8080:8080 -e SIM_BASE_URL=http://127.0.0.1:1 fuelgrid:${{ github.sha }}
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -sf http://127.0.0.1:8080/healthz
          curl -sf http://127.0.0.1:8080/metrics | grep -q fg_degraded
          docker rm -f fg
