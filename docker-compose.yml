# FuelGrid - one command:   docker compose up --build
#   console      http://localhost:8080
#   simulator    http://localhost:8000   (organizer image, unmodified)
# Optional monitoring stack:   docker compose --profile monitoring up --build
#   prometheus   http://localhost:9090      grafana http://localhost:3000  (admin / admin, dashboard pre-loaded)
# The database is a local PostgreSQL 16 + pgvector container (service `db`, data kept in the `fuelgrid-pgdata` volume).
# Any other Postgres works too: set DATABASE_URL (a hosted Postgres such as Supabase needs no code change).
services:
  simulator:
    image: asifmahmoud414/bup-fuel-supply-simulator:1.0.0
    environment:
      SIMULATION_SPEED: ${SIMULATION_SPEED:-8}
      TICK_MINUTES: ${TICK_MINUTES:-15}
      SIMULATOR_START_MODE: ${SIMULATOR_START_MODE:-paused}
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 6

  fuelgrid:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    image: fuelgrid:${GIT_SHA:-dev}
    depends_on:
      simulator: { condition: service_healthy }
      db: { condition: service_healthy }
    environment:
      SIM_BASE_URL: http://simulator:8000
      # local Postgres by default; override DATABASE_URL to use another server, or set it empty to run memory-only
      DATABASE_URL: ${DATABASE_URL-postgresql://fuelgrid:${POSTGRES_PASSWORD:-fuelgrid}@db:5432/fuelgrid}
      AUTO_EXECUTE: ${AUTO_EXECUTE:-false}
      API_KEY: ${API_KEY:-}
      # optional free-tier AI wording for the Ops assistant (Gemini first, Groq backup); works without
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    ports: ["8080:8080"]
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: fuelgrid
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fuelgrid}
      POSTGRES_DB: fuelgrid
    volumes: ["fuelgrid-pgdata:/var/lib/postgresql/data"]
    ports: ["127.0.0.1:5432:5432"]   # reachable from the host for `uvicorn` development; not exposed to the network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fuelgrid -d fuelgrid"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v2.55.0
    volumes: ["./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro", "./deploy/alerts.yml:/etc/prometheus/alerts.yml:ro"]
    ports: ["9090:9090"]
    depends_on: [fuelgrid]

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]

volumes:
  fuelgrid-pgdata:
